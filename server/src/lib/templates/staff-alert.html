<tr>
  <td class="email-pad" style="padding:32px 40px 24px;">
    <p style="margin:0 0 12px;font-size:11px;font-weight:700;letter-spacing:2px;line-height:1.5;text-transform:uppercase;color:#ba1a1a;">{{eyebrow}}</p>
    <h1 class="email-heading" style="margin:0 0 16px;font-size:28px;font-weight:700;line-height:1.25;color:#1c1714;overflow-wrap:anywhere;">{{heading}}</h1>
    <p style="margin:0 0 8px;font-size:15px;line-height:1.7;color:#5f5852;">Hi {{name}},</p>
    <p style="margin:0;font-size:15px;line-height:1.7;color:#1c1714;overflow-wrap:anywhere;">{{message}}</p>
  </td>
</tr>
<tr>
  <td class="email-pad" style="padding:0 40px 32px;">
    <table role="presentation" cellpadding="0" cellspacing="0"><tr><td bgcolor="#1c1714" style="mso-padding-alt:16px 28px;">
      <a href="{{actionUrl}}" style="display:inline-block;padding:16px 28px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;line-height:1.4;text-decoration:none;color:#faf8f5;">Open in the dashboard</a>
    </td></tr></table>
    <p style="margin:16px 0 0;font-size:12px;line-height:1.7;color:#736c66;">You're receiving this because you're an admin on the BagStreet dashboard. Things may have changed since it was sent; check the order before acting.</p>
  </td>
</tr>
