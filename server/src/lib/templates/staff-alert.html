<tr>
  <td class="email-pad" style="padding:32px 40px 24px;">
    <p style="margin:0 0 12px;font-size:12px;font-weight:700;line-height:1.5;text-transform:uppercase;color:#a82d38;">{{eyebrow}}</p>
    <h1 class="email-heading" style="margin:0 0 16px;font-size:28px;font-weight:700;line-height:1.25;color:#232529;overflow-wrap:anywhere;">{{heading}}</h1>
    <p style="margin:0 0 8px;font-size:15px;line-height:1.7;color:#59616a;">Hi {{name}},</p>
    <p style="margin:0;font-size:15px;line-height:1.7;color:#232529;overflow-wrap:anywhere;">{{message}}</p>
  </td>
</tr>
<tr>
  <td class="email-pad" style="padding:0 40px 32px;">
    <table role="presentation" cellpadding="0" cellspacing="0"><tr><td bgcolor="#842b3f" style="border-radius:6px;mso-padding-alt:14px 22px;">
      <a href="{{actionUrl}}" style="display:inline-block;padding:14px 22px;font-size:14px;font-weight:700;line-height:1.4;text-decoration:none;color:#ffffff;">Open in the dashboard &rarr;</a>
    </td></tr></table>
    <p style="margin:16px 0 0;font-size:12px;line-height:1.7;color:#697079;">You're receiving this because you're an admin on the BagStreet dashboard. Things may have changed since it was sent; check the order before acting.</p>
  </td>
</tr>
