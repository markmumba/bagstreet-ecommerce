<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no,address=no,date=no" />
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light only" />
  <title>{{title}}</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
    table { border-spacing:0; }
    a { overflow-wrap:anywhere; }
    :root { color-scheme: light only; supported-color-schemes: light only; }
    @media only screen and (max-width:600px) {
      .email-outer { padding:16px 8px !important; }
      .email-pad { padding-left:24px !important; padding-right:24px !important; }
      .email-heading { font-size:30px !important; }
      .email-stack { display:block !important; width:auto !important; text-align:left !important; }
      .email-stack-last { padding-top:0 !important; }
      .email-total { font-size:24px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#f4efea;color:#1c1714;font-family:Arial,Helvetica,sans-serif;letter-spacing:0;">
  <div aria-hidden="true" style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4efea;">
    <tr>
      <td class="email-outer" align="center" style="padding:32px 12px;">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#faf8f5;border:1px solid #e2d9cf;table-layout:fixed;">
          <tr>
            <td class="email-pad" align="center" style="padding:32px 40px 28px;border-bottom:1px solid #e2d9cf;">
              <a href="{{storefrontUrl}}" style="font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:26px;font-weight:300;letter-spacing:8px;line-height:1.2;color:#1c1714;text-decoration:none;">BAGSTREET</a>
              <p style="margin:8px 0 0;font-size:10px;letter-spacing:2px;text-transform:uppercase;line-height:1.5;color:#736c66;">Handbags &amp; accessories &middot; Nairobi</p>
            </td>
          </tr>
          {{content}}
          <tr>
            <td class="email-pad" style="padding:28px 40px;background:#f4efea;border-top:1px solid #e2d9cf;">
              <p style="margin:0 0 10px;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:18px;line-height:1.4;color:#1c1714;">A little help, whenever you need it.</p>
              <p style="margin:0;font-size:13px;line-height:1.8;color:#5f5852;">
                <a href="https://wa.me/254748096887" style="color:#1c1714;text-decoration:underline;">WhatsApp: 074 809 6887</a><br />
                <a href="mailto:bagstreetke@gmail.com" style="color:#1c1714;text-decoration:underline;">bagstreetke@gmail.com</a>
              </p>
              <p style="margin:16px 0 0;font-size:12px;line-height:1.7;color:#736c66;">Imenti House, Bemack Exhibition, 1st Floor<br />Shop M2, Nairobi</p>
              <p style="margin:16px 0 0;font-size:12px;line-height:1.5;color:#736c66;">&copy; {{year}} BagStreet</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
