<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no,address=no,date=no" />
  <title>{{title}}</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
    table { border-spacing:0; }
    a { overflow-wrap:anywhere; }
    @media only screen and (max-width:600px) {
      .email-outer { padding:16px 8px !important; }
      .email-pad { padding-left:24px !important; padding-right:24px !important; }
      .email-heading { font-size:30px !important; }
      .email-stack { display:block !important; width:auto !important; text-align:left !important; }
      .email-stack-last { padding-top:0 !important; }
      .email-total { font-size:24px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#f1f3f4;color:#232529;font-family:Arial,Helvetica,sans-serif;letter-spacing:0;">
  <div aria-hidden="true" style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f3f4;">
    <tr>
      <td class="email-outer" align="center" style="padding:32px 12px;">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border-top:4px solid #842b3f;table-layout:fixed;">
          <tr>
            <td class="email-pad" style="padding:28px 40px;border-bottom:1px solid #e6e8eb;">
              <a href="{{storefrontUrl}}" style="font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.2;color:#232529;text-decoration:none;">BAGSTREET</a>
              <p style="margin:6px 0 0;font-size:12px;line-height:1.5;color:#697079;">Handbags &amp; accessories &middot; Nairobi</p>
            </td>
          </tr>
          {{content}}
          <tr>
            <td class="email-pad" style="padding:24px 40px;background:#f8f9fa;border-top:1px solid #e6e8eb;">
              <p style="margin:0 0 10px;font-size:14px;font-weight:700;line-height:1.5;color:#232529;">A little help, whenever you need it.</p>
              <p style="margin:0;font-size:13px;line-height:1.8;color:#59616a;">
                <a href="https://wa.me/254748096887" style="color:#842b3f;text-decoration:underline;">WhatsApp: 074 809 6887</a><br />
                <a href="mailto:bagstreetke@gmail.com" style="color:#842b3f;text-decoration:underline;">bagstreetke@gmail.com</a>
              </p>
              <p style="margin:16px 0 0;font-size:12px;line-height:1.7;color:#697079;">Imenti House, Bemack Exhibition, 1st Floor<br />Shop M2, Nairobi</p>
              <p style="margin:16px 0 0;font-size:12px;line-height:1.5;color:#697079;">&copy; {{year}} BagStreet</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
