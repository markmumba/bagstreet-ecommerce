# Production stack for a single DigitalOcean droplet. See docs/deployment.md.
# Images are built by GitHub Actions (.github/workflows/images.yml) and pulled here. Deploy with
#   deploy/deploy.sh
# which pulls, backs up the database, runs migrations, then runs `up -d`.
# (On a droplet with 4 GB+ RAM you can instead build on the server with `build`.)
#
# Only Caddy publishes ports. Everything else is reachable only on the internal Docker network —
# important because Docker-published ports bypass the ufw firewall, and because the API trusts
# Caddy's X-Forwarded-For (TRUST_PROXY_HOPS=1): if the API were reachable directly, clients could
# fake their IP and dodge rate limits.
name: bagstreet

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The API and the migrate job run the same image with the same settings.
x-api-environment: &api-environment
  NODE_ENV: production
  PORT: "3000"
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  SERVER_URL: https://${API_DOMAIN}
  STOREFRONT_URL: https://${SHOP_DOMAIN}
  CLIENT_URL: https://${ADMIN_DOMAIN}
  CORS_ORIGIN: https://${SHOP_DOMAIN},https://${ADMIN_DOMAIN}
  # Caddy is the one proxy in front of the API. Change only if you add another (see docs).
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  # The migrate service applies migrations. The API only checks that none are pending, and
  # refuses to start if any are.
  RUN_MIGRATIONS_ON_STARTUP: "false"

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_SERVER_URL: https://${API_DOMAIN}
    image: ${IMAGE_REGISTRY:-ghcr.io/markmumba}/bagstreet-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Product images origin, allowed by the Content-Security-Policy (see deploy/Caddyfile).
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # Applies pending database migrations, then exits. The API waits for it, so a release never
  # starts against an old schema. Deploy with deploy/deploy.sh, which runs this job on its own
  # before `up`. Plain `up` replaces the old API container first, so a failed migration would
  # leave the shop down.
  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/markmumba}/bagstreet-api:${IMAGE_TAG:-latest}
    command: ["bun", "run", "server/src/scripts/migrate.ts"]
    restart: "no"
    env_file: ../.env.production
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      pre-deploy-backup:
        condition: service_completed_successfully
    logging: *logging

  # Dumps the database before migrate runs, because migrations only go forward: to roll back a
  # release that changed the schema, restore this dump. Kept 14 days by the nightly backup cron.
  pre-deploy-backup:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    command: ["sh", "-c", "pg_dump -Fc -f /backups/pre-deploy-$$(date +%F-%H%M%S).dump && echo 'pre-deploy backup written'"]
    volumes:
      - ${DATA_DIR:-/mnt/bagstreet}/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: ${IMAGE_REGISTRY:-ghcr.io/markmumba}/bagstreet-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env.production
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR:-/mnt/bagstreet}/postgres:/var/lib/postgresql/data
      - ${DATA_DIR:-/mnt/bagstreet}/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
